<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ottimo Davomat Tizimi</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding:20px;
}
h1{
    text-align:center;
}
table{
    width:100%;
    border-collapse:collapse;
    background:white;
}
th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}
th{
    background:#0d6efd;
    color:white;
}
input{
    width:90px;
}
.total{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>Ottimo Davomat Tizimi</h1>

<table id="attendanceTable">
<thead>
<tr>
<th>Kun</th>
<th>Keldi</th>
<th>Ketdi</th>
<th>Ishlagan Soat</th>
<th>Maosh</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div class="total">
Jami Maosh: <span id="totalSalary">0</span> so'm
</div>

<script>

const dailySalary = 180000; // Ilhom uchun

const tbody = document.querySelector("tbody");

for(let day=1; day<=10; day++){

    let row = `
    <tr>
        <td>${day}</td>
        <td><input type="time" class="in"></td>
        <td><input type="time" class="out"></td>
        <td class="hours">0</td>
        <td class="salary">0</td>
    </tr>
    `;

    tbody.innerHTML += row;
}

function calculate(){

    let total = 0;

    document.querySelectorAll("tbody tr").forEach(row=>{

        let inTime = row.querySelector(".in").value;
        let outTime = row.querySelector(".out").value;

        if(inTime && outTime){

            let start = new Date("2025-01-01 "+inTime);
            let end = new Date("2025-01-01 "+outTime);

            let hours = (end-start)/(1000*60*60);

            let salary = (dailySalary/9)*hours;

            row.querySelector(".hours").innerText =
                hours.toFixed(2);

            row.querySelector(".salary").innerText =
                Math.round(salary);

            total += salary;
        }
    });

    document.getElementById("totalSalary").innerText =
        Math.round(total).toLocaleString();
}

document.addEventListener("input",calculate);

</script>

</body>
</html>
