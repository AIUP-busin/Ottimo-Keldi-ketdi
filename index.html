```html
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ottimo Davomat</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.day{
    background:#fff;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#007bff;
    color:#fff;
}

input{
    width:100%;
    padding:5px;
}

.summary{
    margin-top:10px;
    font-weight:bold;
}

.total{
    background:#28a745;
    color:white;
    padding:15px;
    text-align:center;
    border-radius:10px;
    margin-top:20px;
    font-size:20px;
}
</style>
</head>
<body>

<h1>OTTIMO DAVOMAT</h1>

<div id="days"></div>

<div id="employeeTotals"></div>

<div class="total" id="grandTotal">
Umumiy maosh: 0 so'm
</div>

<script>

const employees = [
    {name:"Ilhom", dailySalary:180000},
    {name:"Ibrohim", dailySalary:200000},
    {name:"M.Amin", dailySalary:200000},
    {name:"Zohida", dailySalary:180000},
    {name:"Komila", dailySalary:100000}
];

const startDate = new Date("2026-06-12");
const endDate = new Date("2026-06-22");

function formatDate(date){
    let d = String(date.getDate()).padStart(2,"0");
    let m = String(date.getMonth()+1).padStart(2,"0");
    let y = date.getFullYear();
    return `${d}.${m}.${y}`;
}

const daysDiv = document.getElementById("days");

let current = new Date(startDate);

while(current <= endDate){

    let date = formatDate(current);

    let html = `
    <div class="day">
        <h2>${date}</h2>

        <table>
            <tr>
                <th>Ism</th>
                <th>Keldi</th>
                <th>Ketdi</th>
                <th>Soat</th>
                <th>Maosh</th>
            </tr>
    `;

    employees.forEach((emp,index)=>{

        html += `
        <tr>
            <td>${emp.name}</td>

            <td>
                <input
                    type="text"
                    placeholder="8:00 AM"
                    id="${date}_${index}_in"
                    oninput="saveAndCalc()">
            </td>

            <td>
                <input
                    type="text"
                    placeholder="5:00 PM"
                    id="${date}_${index}_out"
                    oninput="saveAndCalc()">
            </td>

            <td id="${date}_${index}_hours">0</td>

            <td id="${date}_${index}_salary">0</td>
        </tr>
        `;
    });

    html += `
        </table>

        <div class="summary">
            Kunlik jami:
            <span id="${date}_total">0</span> so'm
        </div>
    </div>
    `;

    daysDiv.innerHTML += html;

    current.setDate(current.getDate()+1);
}

function saveAndCalc(){

    document.querySelectorAll("input").forEach(el=>{
        localStorage.setItem(el.id,el.value);
    });

    calculate();
}

function loadData(){

    document.querySelectorAll("input").forEach(el=>{

        let value = localStorage.getItem(el.id);

        if(value){
            el.value = value;
        }
    });

    calculate();
}

function calculate(){

    let grandTotal = 0;

    let totals = {};

    employees.forEach(emp=>{
        totals[emp.name] = {
            hours:0,
            salary:0
        };
    });

    let current = new Date(startDate);

    while(current <= endDate){

        let date = formatDate(current);

        let dayTotal = 0;

        employees.forEach((emp,index)=>{

            let inTime =
            document.getElementById(`${date}_${index}_in`).value;

            let outTime =
            document.getElementById(`${date}_${index}_out`).value;

            let hours = 0;
            let salary = 0;

            if(inTime && outTime){

                let start =
                new Date("2000-01-01 " + inTime);

                let end =
                new Date("2000-01-01 " + outTime);

                if(!isNaN(start) && !isNaN(end)){

                    if(end < start){
                        end.setDate(end.getDate()+1);
                    }

                    hours =
                    (end-start)/(1000*60*60);

                    salary =
                    (hours/9)*emp.dailySalary;
                }
            }

            document.getElementById(
                `${date}_${index}_hours`
            ).innerText =
            hours.toFixed(1);

            document.getElementById(
                `${date}_${index}_salary`
            ).innerText =
            Math.round(salary).toLocaleString();

            totals[emp.name].hours += hours;
            totals[emp.name].salary += salary;

            dayTotal += salary;
        });

        document.getElementById(
            `${date}_total`
        ).innerText =
        Math.round(dayTotal).toLocaleString();

        grandTotal += dayTotal;

        current.setDate(current.getDate()+1);
    }

    let summaryHtml = "";

    employees.forEach(emp=>{

        summaryHtml += `
        <div class="day">
            <h3>${emp.name}</h3>

            <p>
                Jami soat:
                <b>${totals[emp.name].hours.toFixed(1)}</b>
            </p>

            <p>
                Jami maosh:
                <b>
                ${Math.round(
                    totals[emp.name].salary
                ).toLocaleString()} so'm
                </b>
            </p>
        </div>
        `;
    });

    document.getElementById(
        "employeeTotals"
    ).innerHTML =
    summaryHtml;

    document.getElementById(
        "grandTotal"
    ).innerHTML =
    `Umumiy maosh: ${Math.round(grandTotal).toLocaleString()} so'm`;
}

loadData();

</script>

</body>
</html>
