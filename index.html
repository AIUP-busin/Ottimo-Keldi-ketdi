<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ottimo Davomat Tizimi</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:20px;
}
h1{
    text-align:center;
}
table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}
th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}
th{
    background:#0d6efd;
    color:white;
}
input{
    width:90px;
}
tfoot{
    font-weight:bold;
    background:#f0f0f0;
}
</style>
</head>
<body>

<h1>OTTIMO DAVOMAT TIZIMI</h1>

<table id="table">
<thead>
<tr>
<th>Ism</th>
<th>Filial</th>
<th>Sana</th>
<th>Keldi</th>
<th>Ketdi</th>
<th>Ishlagan Soat</th>
<th>Kunlik Stavka</th>
<th>Hisoblangan Maosh</th>
</tr>
</thead>

<tbody>

<tr>
<td>Ilhom</td>
<td>Parus</td>
<td><input type="date"></td>
<td><input type="time" class="in"></td>
<td><input type="time" class="out"></td>
<td class="hours">0</td>
<td class="rate">180000</td>
<td class="salary">0</td>
</tr>

<tr>
<td>Ibrohim</td>
<td>Parus</td>
<td><input type="date"></td>
<td><input type="time" class="in"></td>
<td><input type="time" class="out"></td>
<td class="hours">0</td>
<td class="rate">200000</td>
<td class="salary">0</td>
</tr>

<tr>
<td>Zohida</td>
<td>Parus</td>
<td><input type="date"></td>
<td><input type="time" class="in"></td>
<td><input type="time" class="out"></td>
<td class="hours">0</td>
<td class="rate">180000</td>
<td class="salary">0</td>
</tr>

<tr>
<td>Komila</td>
<td>Parus</td>
<td><input type="date"></td>
<td><input type="time" class="in"></td>
<td><input type="time" class="out"></td>
<td class="hours">0</td>
<td class="rate">100000</td>
<td class="salary">0</td>
</tr>

<tr>
<td>Muhammad Amin</td>
<td>Parus</td>
<td><input type="date"></td>
<td><input type="time" class="in"></td>
<td><input type="time" class="out"></td>
<td class="hours">0</td>
<td class="rate">200000</td>
<td class="salary">0</td>
</tr>

</tbody>

<tfoot>
<tr>
<td colspan="7">JAMI OYLIK</td>
<td id="total">0</td>
</tr>
</tfoot>

</table>

<script>

function calculate(){

let total = 0;

document.querySelectorAll("tbody tr").forEach(row=>{

const inTime = row.querySelector(".in").value;
const outTime = row.querySelector(".out").value;
const rate = Number(row.querySelector(".rate").innerText);

if(inTime && outTime){

const start = new Date("2025-01-01T"+inTime);
const end = new Date("2025-01-01T"+outTime);

const hours = (end-start)/(1000*60*60);

const salary = (rate/9)*hours;

row.querySelector(".hours").innerText =
hours.toFixed(2);

row.querySelector(".salary").innerText =
Math.round(salary).toLocaleString();

total += salary;
}

});

document.getElementById("total").innerText =
Math.round(total).toLocaleString();

}

document.addEventListener("input",calculate);

</script>

</body>
</html>
