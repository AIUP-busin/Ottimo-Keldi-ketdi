```html
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ottimo Davomat Tizimi</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.day-block{
    background:white;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.day-title{
    text-align:center;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#007bff;
    color:white;
}

input[type=time]{
    width:100%;
    padding:5px;
}

.summary{
    margin-top:15px;
    padding:10px;
    background:#f7f7f7;
    border-radius:8px;
}

.employee-summary{
    background:white;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.employee-summary h3{
    margin-bottom:10px;
}

.total-box{
    margin-top:20px;
    background:#28a745;
    color:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>OTTIMO DAVOMAT TIZIMI</h1>

<div id="days"></div>

<div id="employeeSummaries"></div>

<div class="total-box" id="grandTotal">
Umumiy hisob: 0 so'm
</div>

<script>

const employees = [
 {name:"Ilhom", dailySalary:180000},
 {name:"Ibrohim", dailySalary:200000},
 {name:"M.Amin", dailySalary:200000},
 {name:"Zohida", dailySalary:180000},
 {name:"Komila", dailySalary:100000}
];

const startDate = new Date("2026-06-12");
const endDate = new Date("2026-06-22");

const daysContainer = document.getElementById("days");

function formatDate(date){
    let d = String(date.getDate()).padStart(2,"0");
    let m = String(date.getMonth()+1).padStart(2,"0");
    let y = date.getFullYear();
    return `${d}.${m}.${y}`;
}

let current = new Date(startDate);

while(current <= endDate){

    const dateText = formatDate(current);

    let html = `
    <div class="day-block">
        <h2 class="day-title">${dateText}</h2>

        <table>
            <tr>
                <th>Ism</th>
                <th>Keldi</th>
                <th>Ketdi</th>
                <th>Soat</th>
                <th>Maosh</th>
            </tr>
    `;

    employees.forEach((emp,index)=>{

        const keyIn = `${dateText}_${index}_in`;
        const keyOut = `${dateText}_${index}_out`;

        html += `
        <tr>
            <td>${emp.name}</td>

            <td>
                <input
                    type="time"
                    id="${keyIn}"
                    onchange="saveData()"
                >
            </td>

            <td>
                <input
                    type="time"
                    id="${keyOut}"
                    onchange="saveData()"
                >
            </td>

            <td id="${dateText}_${index}_hours">0</td>

            <td id="${dateText}_${index}_salary">0</td>
        </tr>
        `;
    });

    html += `
        </table>

        <div class="summary">
            Kunlik umumiy: <span id="${dateText}_total">0</span> so'm
        </div>
    </div>
    `;

    daysContainer.innerHTML += html;

    current.setDate(current.getDate()+1);
}

function saveData(){

    document
    .querySelectorAll('input[type="time"]')
    .forEach(input=>{
        localStorage.setItem(input.id,input.value);
    });

    calculate();
}

function loadData(){

    document
    .querySelectorAll('input[type="time"]')
    .forEach(input=>{

        let value = localStorage.getItem(input.id);

        if(value){
            input.value = value;
        }
    });

    calculate();
}

function calculate(){

    let employeeTotals = {};
    let grandTotal = 0;

    employees.forEach(emp=>{
        employeeTotals[emp.name] = {
            hours:0,
            salary:0
        };
    });

    let current = new Date(startDate);

    while(current <= endDate){

        const dateText = formatDate(current);

        let dailyTotal = 0;

        employees.forEach((emp,index)=>{

            const inTime =
            document.getElementById(`${dateText}_${index}_in`).value;

            const outTime =
            document.getElementById(`${dateText}_${index}_out`).value;

            let hours = 0;
            let salary = 0;

            if(inTime && outTime){

                const start =
                new Date(`2024-01-01 ${inTime}`);

                const finish =
                new Date(`2024-01-01 ${outTime}`);

                hours =
                (finish-start)/1000/60/60;

                if(hours < 0){
                    hours = 0;
                }

                salary =
                (hours/9)*emp.dailySalary;
            }

            document.getElementById(
                `${dateText}_${index}_hours`
            ).innerText =
            hours.toFixed(1);

            document.getElementById(
                `${dateText}_${index}_salary`
            ).innerText =
            Math.round(salary).toLocaleString();

            employeeTotals[emp.name].hours += hours;
            employeeTotals[emp.name].salary += salary;

            dailyTotal += salary;
        });

        document.getElementById(
            `${dateText}_total`
        ).innerText =
        Math.round(dailyTotal).toLocaleString();

        grandTotal += dailyTotal;

        current.setDate(current.getDate()+1);
    }

    let summaryHTML = "";

    employees.forEach(emp=>{

        summaryHTML += `
        <div class="employee-summary">

            <h3>${emp.name}</h3>

            <p>
            Jami soat:
            <b>
            ${employeeTotals[emp.name].hours.toFixed(1)}
            </b>
            </p>

            <p>
            Jami maosh:
            <b>
            ${Math.round(
            employeeTotals[emp.name].salary
            ).toLocaleString()}
            so'm
            </b>
            </p>

        </div>
        `;
    });

    document.getElementById(
        "employeeSummaries"
    ).innerHTML = summaryHTML;

    document.getElementById(
        "grandTotal"
    ).innerHTML =
    `Umumiy hisob: ${Math.round(grandTotal).toLocaleString()} so'm`;
}

loadData();

</script>

</body>
</html>
